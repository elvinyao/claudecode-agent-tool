name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv lock --check
      - run: uv sync --locked --all-extras
      - run: uv run ruff check packages/agent-core/src plugins/trivy-ai-report/src tests
      - run: uv run pytest --cov=agent_core --cov=trivy_ai_report --cov-branch
      - run: uv build --package agent-core
      - run: uv build --package trivy-ai-report

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv build --package agent-core --out-dir dist
      - run: uv build --package trivy-ai-report --out-dir dist
      - run: uv venv .smoke-venv
      - run: uv pip install --python .smoke-venv/bin/python dist/agent_core-*.whl dist/trivy_ai_report-*.whl
      - run: uv pip check --python .smoke-venv/bin/python
      - run: .smoke-venv/bin/python -c "from agent_core.registry import PluginRegistry; assert PluginRegistry.from_entry_points().get('trivy').version == '0.2.0'"
