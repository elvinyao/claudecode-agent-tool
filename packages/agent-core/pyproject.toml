[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-core"
version = "0.1.0"
description = "Typed local-first workflow framework for deterministic and AI-assisted tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
antigravity = ["google-antigravity>=0.1.13,<0.2"]
codex = ["openai-codex>=0.144.4,<1"]
claude = ["claude-agent-sdk>=0.2.130,<1"]
web = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.28,<1",
]
all = [
  "google-antigravity>=0.1.13,<0.2",
  "openai-codex>=0.144.4,<1",
  "claude-agent-sdk>=0.2.130,<1",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.28,<1",
]

[project.scripts]
agent-core = "agent_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
