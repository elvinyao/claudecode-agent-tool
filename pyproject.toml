[tool.uv.workspace]
members = ["packages/agent-core", "plugins/trivy-ai-report"]

[tool.uv.sources]
agent-core = { workspace = true }
trivy-ai-report = { workspace = true }

[dependency-groups]
dev = [
  "agent-core[all]",
  "trivy-ai-report",
  "beautifulsoup4>=4.12,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["packages/agent-core/src", "plugins/trivy-ai-report/src"]
asyncio_mode = "auto"
markers = ["live: calls a real provider SDK"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["packages/agent-core/src", "plugins/trivy-ai-report/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["agent_core", "trivy_ai_report"]

[tool.coverage.report]
show_missing = true
fail_under = 80
