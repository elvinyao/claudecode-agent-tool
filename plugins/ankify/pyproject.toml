[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ankify-agent"
version = "0.1.0"
description = "Evidence-grounded Anki card generation domain plugin for agent-core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "agent-core>=0.1,<0.2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
codex = ["agent-core[codex]>=0.1,<0.2"]
claude = ["agent-core[claude]>=0.1,<0.2"]
all = ["agent-core[all]>=0.1,<0.2"]

[project.entry-points."agent_core.domain_plugins"]
ankify = "ankify.plugin:create_plugin"

[project.scripts]
ankify-eval = "ankify.eval.cli:main"

[tool.uv.sources]
agent-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ankify"]
